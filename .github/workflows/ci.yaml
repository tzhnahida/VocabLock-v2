name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          check-latest: true
          cache-dependency-path: backend/go.sum

      - name: Verify Go version
        run: go version

      - name: Vet
        run: go vet ./...

      - name: Staticcheck
        shell: bash
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          "$(go env GOPATH)/bin/staticcheck" ./...

      - name: Test with coverage
        shell: bash
        run: |
          go test ./... -count=1 -coverprofile=coverage.out -covermode=atomic
          total=$(go tool cover -func=coverage.out | tail -1 | grep -oE '[0-9]+(\.[0-9]+)?%' | tr -d '%')
          echo "coverage: ${total}%"
          if awk -v t="$total" 'BEGIN { exit !(t >= 41) }'; then
            echo "total coverage meets the 41% floor"
          else
            echo "total coverage ${total}% is below the 32% floor" >&2
            exit 1
          fi

          go test ./internal/api/ -count=1 -coverprofile=api.out
          api=$(go tool cover -func=api.out | tail -1 | grep -oE '[0-9]+(\.[0-9]+)?%' | tr -d '%')
          echo "internal/api coverage: ${api}%"
          if awk -v t="$api" 'BEGIN { exit !(t >= 46) }'; then
            echo "internal/api coverage meets the 46% floor"
          else
            echo "internal/api coverage ${api}% is below the 31% floor" >&2
            exit 1
          fi

      - name: Vulnerability scan
        shell: bash
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

      - name: Build
        run: go build -o vocablock.exe ./cmd/server/

  race:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          check-latest: true
          cache-dependency-path: backend/go.sum

      - name: Race detector
        run: go test -race ./...

  lint:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: electron

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: electron/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

  electron:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: electron

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: electron/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Type check
        run: npx tsc --noEmit -p tsconfig.json

      - name: Build
        run: npm run build

  e2e:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          check-latest: true
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: electron/package-lock.json

      - name: Install shell dependencies
        run: npm ci
        working-directory: electron

      - name: Build shell
        run: npm run build
        working-directory: electron

      - name: Build mock backend
        run: go build -o vocablock-e2e.exe ./cmd/server
        working-directory: backend

      - name: Electron smoke test
        run: npx playwright test
        working-directory: electron