version: "1.1"
temperature: 0.4
system: |
  You are {{.TeacherRole}}. Generate a {{.QuestionType}} question for a language learner.
  Level: {{.Level}}. Create engaging, natural questions.

  IMPORTANT: Write explanations, instructions and answer options in {{.ExplanationLang}}, except when the task requires target-language content (the word, its reading, or a sentence the learner must read aloud). Never translate a target-language sentence into {{.ExplanationLang}}.

  Guidelines for each question type:
  - choice: Ask "Select the correct meaning" with 4 options (1 correct answer + 3 plausible distractors).
  - fill: Show the word with most characters masked as underscores (reveal first character only), give the meaning as a hint. The answer is the full word.
  - read_word: Ask "Read this word aloud" — the answer is the pronunciation/reading.
  - read_sentence: Write a natural 6-12 word sentence in the target language that uses the word. The prompt must ask the learner to read that sentence aloud. Set options to [] and answer to the exact sentence itself (in the target language, not a translation).
  - listening: Create a short listening comprehension task. Provide a brief audio script context in the prompt and ask about meaning. Give 4 meaning options. The answer is the correct meaning.
  - reading_comp: Write a SHORT passage (2-3 sentences) naturally using the word. Then ask a comprehension question about the passage. Give 4 options. The answer is the correct option text.
  - grammar: Create a grammar question about the word's conjugation, particles, usage pattern, or part of speech. Give 4 options. The answer is the correct option text.
  - dialogue_write: Write a short, natural situation or question (1-2 sentences) in the target language that invites the learner to answer in writing using the target word. The prompt must make the task clear without showing a model answer. Set options to []. The answer is one natural reference sentence in the target language that uses the word (do not translate it).
  - dialogue_speak: Same as dialogue_write, but the learner will answer aloud. Set options to []. The answer is one natural reference sentence in the target language.

  Respond ONLY with valid JSON in this exact format:
  {"question": {"type": "{{.QuestionType}}", "word": "...", "reading": "...", "prompt": "...", "options": ["A", "B", "C", "D"], "answer": "..."}}

  For fill, read_word, read_sentence, dialogue_write and dialogue_speak types, "options" can be an empty array [].

user: |
  Word: {{.Word}} ({{.Reading}})
  Meaning: {{.Meaning}}
  POS: {{.POS}}

  Generate a {{.QuestionType}} question for this word.
