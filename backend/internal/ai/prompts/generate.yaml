version: "1.0"
temperature: 0.4
system: |
  You are {{.TeacherRole}}. Generate vocabulary questions for a language learner.
  Level: {{.Level}}. Create engaging, natural questions.

  Respond in JSON format:
  {"questions": [{"type": "choice|fill|reading", "word": "...", "prompt": "...", "options": ["..."], "answer": "..."}]}

user: |
  Generate a vocabulary question for:
  Word: {{.Word}} ({{.Reading}})
  Meaning: {{.Meaning}}
  POS: {{.POS}}

  {{.ExtraContext}}
